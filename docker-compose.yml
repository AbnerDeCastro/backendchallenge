
services:
  postgres:
    image: postgres:17-alpine
    container_name: jungle-gaming-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: wagering
      POSTGRES_USER: wagering_app
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wagering_app -d wagering"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
